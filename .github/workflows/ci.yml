name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySide6, ciplak bir ubuntu-latest runner'inda bulunmayan birkac Qt
      # calisma zamani paylasimli kutuphanesine (libEGL, libxkbcommon vb.)
      # dinamik olarak baglaniyor -- bunlar olmadan import bile patlar,
      # offscreen platformu bile bu adimi atlatmiyor.
      - name: Qt calisma zamani bagimliliklarini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install
        run: pip install -e .[dev]

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
